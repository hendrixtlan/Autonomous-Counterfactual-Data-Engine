[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "temporalx-lab"
version = "0.3.0"
description = "A reproducible reference engine for bitemporal replay, local event archive, checkpoint-isolated state recovery, Kafka, and Databricks Delta workflows"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["databricks", "streaming", "bitemporal", "replay", "event-sourcing"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0", "PyYAML>=6.0"]
kafka = ["confluent-kafka>=2.4,<3"]

[project.scripts]
temporalx = "temporalx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
