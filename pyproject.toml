[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "temporalx-lab"
version = "0.8.0"
description = "Counterfactual replay, Databricks Lakehouse modernization, CDC, distributed state diff and RocksDB recovery research"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["databricks", "streaming", "bitemporal", "replay", "event-sourcing"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0", "PyYAML>=6.0"]
kafka = ["confluent-kafka>=2.4,<3"]
spark = ["pyspark>=3.5,<5"]
agent = ["langgraph>=1.0,<2"]
tracing = ["mlflow[databricks]>=3.14,<4", "langgraph>=1.0,<2"]

[project.scripts]
temporalx = "temporalx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
